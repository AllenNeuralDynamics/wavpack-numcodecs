[build-system]
requires = ["scikit-build-core>=0.11", "cython>=3.1", "cython-cmake>=0.2"]
build-backend = "scikit_build_core.build"

[project]
name = "wavpack-numcodecs"
version = "0.3.2"
description = "Numcodecs implementation of WavPack audio codec."
authors = [
    {name = "Alessio Buccino", email = "alessiop.buccino@gmail.com"},
    {name = "David Bryant", email = "david@wavpack.com"},
]
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "extern/wavpack/COPYING"]
requires-python = ">=3.11"
keywords = ["wavpack", "zarr", "numcodecs", "compression", "electrophysiology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "numcodecs",
    "packaging",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/wavpack-numcodecs"
Issues = "https://github.com/AllenNeuralDynamics/wavpack-numcodecs/issues"

[project.entry-points."numcodecs.codecs"]
wavpack = "wavpack_numcodecs.wavpack:WavPack"

[project.entry-points."zarr.codecs"]
wavpack = "wavpack_numcodecs.wavpackv3:WavPack"

[dependency-groups]
dev = ["pytest", "zarr"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# One wheel per platform for every CPython from 3.11 on (the buffer protocol joined the limited API in 3.11).
wheel.py-api = "cp311"
wheel.packages = ["src/wavpack_numcodecs"]
wheel.exclude = ["**.pyx", "**.pxd", "wavpack_numcodecs/src/**"]
install.components = ["python"]
sdist.exclude = [
    ".github",
    "extern/wavpack/.github",
    "extern/wavpack/audition",
    "extern/wavpack/fuzzing",
    "extern/wavpack/winamp",
    "extern/wavpack/xmms",
    "extern/wavpack/wavpackexe",
    "extern/wavpack/wvgainexe",
    "extern/wavpack/wvtagexe",
    "extern/wavpack/wvtestexe",
    "extern/wavpack/wvunpackexe",
]

[tool.cibuildwheel]
# The cp311 wheel is abi3 and serves every later CPython; platforms without a wheel build from the sdist.
build = "cp311-*"
skip = "*-musllinux_*"
archs = ["auto64"]
config-settings = { "cmake.define.WAVPACK_NUMCODECS_WAVPACK" = "BUNDLED" }
test-groups = ["dev"]
test-sources = ["tests"]
test-command = "python -m pytest tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
